[project]
name = "stl-webapp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "pydantic-settings",
    "sqlalchemy>=2.1.9",
    "alembic>=1.20.1",
    "psycopg[binary]>=3.3.9",
    "pyjwt[crypto]>=2.15.1",
    "httpx>=0.28.1",
    "python-multipart>=0.0.34",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "openpyxl>=3.1.5",
    "beautifulsoup4>=4.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
