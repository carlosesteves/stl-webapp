{% extends "base.html" %}
{% block title %}Admin{% endblock %}
{% block content %}
<h1>Items</h1>
<form method="post" action="/admin/logout"><button type="submit">Log out</button></form>
<p><a href="/admin/items/new">New item</a></p>
<table>
  <tr><th>Name</th><th>Description</th><th>Published</th><th></th></tr>
  {% for item in items %}
  <tr>
    <td>{{ item.name }}</td>
    <td>{{ item.description }}</td>
    <td>{{ "yes" if item.published else "no" }}</td>
    <td>
      <a href="/admin/items/{{ item.id }}/edit">Edit</a>
      <form method="post" action="/admin/items/{{ item.id }}/delete" style="display:inline">
        <button type="submit">Delete</button>
      </form>
    </td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
