{% extends "admin/base.html" %}
{% block title %}{{ "Edit" if organization else "New" }} organization | Admin{% endblock %}
{% block content %}
<h1 class="h3 mb-4">{{ "Edit" if organization else "New" }} organization</h1>
<form method="post" action="{{ action }}" class="col-lg-8">
  <div class="mb-3">
    <label class="form-label" for="name">Name</label>
    <input class="form-control" id="name" name="name" required value="{{ organization.name if organization else '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label" for="description">Description</label>
    <textarea class="form-control" id="description" name="description" rows="4">{{ organization.description or '' if organization else '' }}</textarea>
  </div>
  <div class="form-check mb-4">
    <input class="form-check-input" type="checkbox" id="is_published" name="is_published" {{ "checked" if organization and organization.is_published }}>
    <label class="form-check-label" for="is_published">Published</label>
  </div>
  <button type="submit" class="btn btn-primary">Save</button>
  <a class="btn btn-link" href="/admin">Cancel</a>
</form>
{% endblock %}
